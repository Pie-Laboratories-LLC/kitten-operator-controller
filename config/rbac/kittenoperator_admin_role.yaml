# This rule is not used by the project kitten-operator-controller itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over kitten.pielaboratories.com.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: kitten-operator-controller
    app.kubernetes.io/managed-by: kustomize
  name: kittenoperator-admin-role
rules:
- apiGroups:
  - kitten.pielaboratories.com
  resources:
  - kittenoperators
  verbs:
  - '*'
- apiGroups:
  - kitten.pielaboratories.com
  resources:
  - kittenoperators/status
  verbs:
  - get
