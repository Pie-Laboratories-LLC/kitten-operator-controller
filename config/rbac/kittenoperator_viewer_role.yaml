# This rule is not used by the project kitten-operator-controller itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to kitten.pielaboratories.com resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: kitten-operator-controller
    app.kubernetes.io/managed-by: kustomize
  name: kittenoperator-viewer-role
rules:
- apiGroups:
  - kitten.pielaboratories.com
  resources:
  - kittenoperators
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - kitten.pielaboratories.com
  resources:
  - kittenoperators/status
  verbs:
  - get
